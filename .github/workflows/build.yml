name: Build Bretje P BV 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        shell: bash
        run: |
          set -e

          rm -rf build/game

          mkdir -p build/game/app/src/main/java/com/bretjepbv/game
          mkdir -p build/game/app/src/main/assets

          cat > build/game/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BretjePBV"
          include(":app")
          EOF

          cat > build/game/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > build/game/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bretjepbv.game'
              compileSdk 35

              defaultConfig {
                  applicationId "com.bretjepbv.game"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > build/game/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Bretje P B.V."
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          mkdir -p build/game/app/src/main/res/values

          cat > build/game/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          cat > build/game/app/src/main/java/com/bretjepbv/game/MainActivity.java <<'EOF'
          package com.bretjepbv.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "Downloading Three.js..."
          curl -L \
          https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js \
          -o build/game/app/src/main/assets/three.min.js

          cat > build/game/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width,
                initial-scale=1,
                maximum-scale=1,
                user-scalable=no">

          <title>Bretje P B.V.</title>

          <style>

          * {
              box-sizing:border-box;
              user-select:none;
              -webkit-user-select:none;
          }

          html,body {
              margin:0;
              width:100%;
              height:100%;
              overflow:hidden;
              background:#111;
              font-family:Arial,Helvetica,sans-serif;
          }

          canvas {
              display:block;
          }

          #title {
              position:absolute;
              left:25px;
              top:18px;

              color:white;
              font-size:38px;
              font-weight:900;

              text-shadow:
              3px 3px 0 #000,
              5px 5px 12px #000;
          }

          #title span {
              color:#ff6a00;
          }

          #subtitle {
              font-size:15px;
              letter-spacing:3px;
              color:#ddd;
          }

          #menu {
              position:absolute;
              left:25px;
              top:110px;

              width:210px;
          }

          .button {
              background:rgba(10,10,10,.88);
              color:#fff;

              padding:14px;
              margin-bottom:7px;

              font-size:17px;
              font-weight:bold;

              border-left:6px solid #ff6a00;

              box-shadow:
              0 3px 10px rgba(0,0,0,.55);
          }

          .button:active {
              background:#ff6a00;
          }

          #job {
              position:absolute;
              right:18px;
              top:18px;

              width:250px;

              background:rgba(0,0,0,.72);
              color:white;

              border-top:5px solid #ff6a00;

              padding:13px;

              box-shadow:
              0 4px 15px rgba(0,0,0,.5);
          }

          #job h3 {
              margin:0 0 7px 0;
              color:#ff6a00;
          }

          #hint {
              position:absolute;
              bottom:15px;
              left:50%;
              transform:translateX(-50%);

              color:#fff;
              background:rgba(0,0,0,.65);

              padding:9px 18px;
              border-radius:4px;

              font-size:13px;
          }

          </style>
          </head>

          <body>

          <div id="title">
              <span>BRETJE P B.V.</span>
              <div id="subtitle">DAKWERK SIMULATOR</div>
          </div>

          <div id="menu">

              <div class="button" onclick="startGame()">
                  ▶ SPELEN
              </div>

              <div class="button">
                  OPDRACHTEN
              </div>

              <div class="button">
                  WERKTUIGEN
              </div>

              <div class="button">
                  INSTELLINGEN
              </div>

              <div class="button">
                  HIGHSCORES
              </div>

          </div>

          <div id="job">
              <h3>DAK OPDRACHT</h3>
              Brand nieuwe bitumen dakbanen op het platte dak.
              <br><br>
              Pas op voor brand bij opstanden en doorvoeren.
          </div>

          <div id="hint">
              Sleep over het scherm om rond het dak te kijken
          </div>

          <script src="three.min.js"></script>

          <script>

          const scene = new THREE.Scene();

          scene.background =
              new THREE.Color(0x76b9ef);

          scene.fog =
              new THREE.Fog(0x9ec9e8,55,160);


          const camera =
              new THREE.PerspectiveCamera(
                  62,
                  innerWidth / innerHeight,
                  .1,
                  500
              );

          camera.position.set(18,15,24);


          const renderer =
              new THREE.WebGLRenderer({
                  antialias:true
              });

          renderer.setPixelRatio(
              Math.min(devicePixelRatio,2)
          );

          renderer.setSize(
              innerWidth,
              innerHeight
          );

          renderer.shadowMap.enabled=true;

          renderer.shadowMap.type=
              THREE.PCFSoftShadowMap;

          document.body.appendChild(
              renderer.domElement
          );


          const hemi =
              new THREE.HemisphereLight(
                  0xd8edff,
                  0x565656,
                  2
              );

          scene.add(hemi);


          const sun =
              new THREE.DirectionalLight(
                  0xffffff,
                  3
              );

          sun.position.set(
              -25,
              45,
              20
          );

          sun.castShadow=true;

          scene.add(sun);


          function mat(color,rough=.8) {

              return new THREE.MeshStandardMaterial({
                  color:color,
                  roughness:rough
              });

          }


          function box(
              w,h,d,
              color,
              x,y,z
          ) {

              const mesh =
                  new THREE.Mesh(
                      new THREE.BoxGeometry(
                          w,h,d
                      ),
                      mat(color)
                  );

              mesh.position.set(x,y,z);

              mesh.castShadow=true;
              mesh.receiveShadow=true;

              scene.add(mesh);

              return mesh;
          }


          //
          // GEBOUW
          //

          box(
              34,
              20,
              25,
              0xb7afa5,
              0,
              -10.2,
              0
          );


          //
          // DAKVLAK
          //

          box(
              34,
              .55,
              25,
              0x292929,
              0,
              .05,
              0
          );


          //
          // BITUMEN DAKBANEN
          // halfsteens / verspringend
          //

          const roofMaterial =
              mat(0x242424,1);

          for(let row=0;row<10;row++) {

              const z =
                  -10.8 + row*2.25;

              const offset =
                  row%2===0 ? 0 : 2.3;

              for(let col=-4;col<=4;col++) {

                  const strip =
                      new THREE.Mesh(
                          new THREE.BoxGeometry(
                              4.5,
                              .035,
                              2.08
                          ),
                          roofMaterial
                      );

                  strip.position.set(
                      col*4.6 + offset,
                      .355,
                      z
                  );

                  strip.receiveShadow=true;

                  scene.add(strip);

              }

          }


          //
          // LASNADEN
          //

          const seamMat =
              mat(0x444444);

          for(let z=-10;z<11;z+=2.25) {

              const seam =
                  new THREE.Mesh(
                      new THREE.BoxGeometry(
                          32,
                          .025,
                          .06
                      ),
                      seamMat
                  );

              seam.position.set(
                  0,
                  .39,
                  z
              );

              scene.add(seam);

          }


          //
          // DAKRAND / OPSTAND
          //

          box(
              34,
              1.15,
              .55,
              0x777777,
              0,
              .75,
              -12.2
          );

          box(
              34,
              1.15,
              .55,
              0x777777,
              0,
              .75,
              12.2
          );

          box(
              .55,
              1.15,
              24,
              0x777777,
              -16.7,
              .75,
              0
          );

          box(
              .55,
              1.15,
              24,
              0x777777,
              16.7,
              .75,
              0
          );


          //
          // METALEN DAKRAND
          //

          box(
              34.5,
              .10,
              .8,
              0xb4b4b4,
              0,
              1.36,
              -12.25
          );

          box(
              34.5,
              .10,
              .8,
              0xb4b4b4,
              0,
              1.36,
              12.25
          );


          //
          // SCHOORSTEEN
          //

          box(
              3.2,
              3.2,
              2.8,
              0x8c4d2e,
              6,
              1.9,
              -3
          );

          box(
              3.55,
              .35,
              3.15,
              0x555555,
              6,
              3.65,
              -3
          );


          //
          // SCHOORSTEEN BITUMEN OPSTAND
          //

          box(
              3.7,
              .45,
              3.3,
              0x222222,
              6,
              .58,
              -3
          );


          //
          // ONTLUCHTING
          //

          const pipe =
              new THREE.Mesh(
                  new THREE.CylinderGeometry(
                      .45,
                      .55,
                      2.7,
                      18
                  ),
                  mat(0x555555,.4)
              );

          pipe.position.set(
              -5,
              1.7,
              3
          );

          pipe.castShadow=true;

          scene.add(pipe);


          const pipeHat =
              new THREE.Mesh(
                  new THREE.CylinderGeometry(
                      .8,
                      .8,
                      .18,
                      18
                  ),
                  mat(0x333333)
              );

          pipeHat.position.set(
              -5,
              3.1,
              3
          );

          scene.add(pipeHat);


          //
          // DAKAFVOER
          //

          const drain =
              new THREE.Mesh(
                  new THREE.CylinderGeometry(
                      .55,
                      .55,
                      .08,
                      24
                  ),
                  mat(0x111111)
              );

          drain.position.set(
              13,
              .42,
              8
          );

          scene.add(drain);


          //
          // ROLLEN DAKLEER
          //

          function roofRoll(x,z,rot=0) {

              const r =
                  new THREE.Mesh(
                      new THREE.CylinderGeometry(
                          .72,
                          .72,
                          2.4,
                          24
                      ),
                      mat(0x171717)
                  );

              r.rotation.z =
                  Math.PI/2;

              r.rotation.y=rot;

              r.position.set(
                  x,
                  1,
                  z
              );

              r.castShadow=true;

              scene.add(r);

          }

          roofRoll(10,5,.3);
          roofRoll(11.5,4,.2);
          roofRoll(9,7,-.3);


          //
          // GASFLES
          //

          const bottle =
              new THREE.Mesh(
                  new THREE.CylinderGeometry(
                      .6,
                      .7,
                      2.5,
                      18
                  ),
                  mat(0xb12424,.5)
              );

          bottle.position.set(
              -9,
              1.55,
              -6
          );

          bottle.castShadow=true;

          scene.add(bottle);


          //
          // HOUTEN PALLET
          //

          for(let i=0;i<5;i++) {

              box(
                  4,
                  .15,
                  .5,
                  0x8d6035,
                  -10,
                  .52,
                  5+i*.7
              );

          }


          //
          // BREtje BLOCKY PERSONAGE
          //

          const worker =
              new THREE.Group();


          const trousers =
              new THREE.Mesh(
                  new THREE.BoxGeometry(
                      1.5,
                      2.2,
                      .9
                  ),
                  mat(0x222222)
              );

          trousers.position.y=1.4;

          worker.add(trousers);


          const body =
              new THREE.Mesh(
                  new THREE.BoxGeometry(
                      2,
                      2.4,
                      1
                  ),
                  mat(0x252525)
              );

          body.position.y=3.5;

          worker.add(body);


          const head =
              new THREE.Mesh(
                  new THREE.BoxGeometry(
                      1.35,
                      1.45,
                      1.25
                  ),
                  mat(0xd19b73)
              );

          head.position.y=5.35;

          worker.add(head);


          const beanie =
              new THREE.Mesh(
                  new THREE.BoxGeometry(
                      1.5,
                      .55,
                      1.4
                  ),
                  mat(0x111111)
              );

          beanie.position.y=6;

          worker.add(beanie);


          //
          // ARM MET BRANDER
          //

          const arm =
              new THREE.Mesh(
                  new THREE.BoxGeometry(
                      .45,
                      2,
                      .45
                  ),
                  mat(0xd19b73)
              );

          arm.position.set(
              1.25,
              3.5,
              0
          );

          arm.rotation.z=-.6;

          worker.add(arm);


          const torch =
              new THREE.Mesh(
                  new THREE.CylinderGeometry(
                      .10,
                      .10,
                      2.8,
                      10
                  ),
                  mat(0x555555)
              );

          torch.position.set(
              2,
              2.55,
              0
          );

          torch.rotation.z=-1;

          worker.add(torch);


          const flame =
              new THREE.Mesh(
                  new THREE.ConeGeometry(
                      .35,
                      1.4,
                      12
                  ),
                  new THREE.MeshBasicMaterial({
                      color:0xff6600
                  })
              );

          flame.position.set(
              3.45,
              2.15,
              0
          );

          flame.rotation.z=-Math.PI/2;

          worker.add(flame);


          worker.position.set(
              0,
              .4,
              2
          );

          scene.add(worker);


          //
          // STAD / GEBOUWEN BENEDEN
          //

          const cityColors=[
              0xb4afa8,
              0x8c969e,
              0xc2b9ac,
              0x9f8776,
              0xa5a5a5
          ];

          for(let i=0;i<70;i++) {

              const angle =
                  Math.random() *
                  Math.PI*2;

              const dist =
                  35 +
                  Math.random()*90;

              const h =
                  5 +
                  Math.random()*20;

              const w =
                  5 +
                  Math.random()*10;

              const d =
                  5 +
                  Math.random()*10;

              const building =
                  new THREE.Mesh(
                      new THREE.BoxGeometry(
                          w,
                          h,
                          d
                      ),
                      mat(
                          cityColors[
                              Math.floor(
                                  Math.random()*
                                  cityColors.length
                              )
                          ]
                      )
                  );

              building.position.set(
                  Math.cos(angle)*dist,
                  -h/2-13,
                  Math.sin(angle)*dist
              );

              scene.add(building);

          }


          //
          // CAMERA BESTURING
          //

          let targetX=0;
          let targetY=0;

          let currentX=.55;
          let currentY=.25;

          let dragging=false;
          let lastX=0;
          let lastY=0;


          function startPointer(x,y) {

              dragging=true;
              lastX=x;
              lastY=y;

          }


          function movePointer(x,y) {

              if(!dragging)return;

              const dx=x-lastX;
              const dy=y-lastY;

              targetX -= dx*.006;
              targetY += dy*.004;

              targetY =
                  Math.max(
                      -.05,
                      Math.min(
                          .65,
                          targetY
                      )
                  );

              lastX=x;
              lastY=y;

          }


          renderer.domElement.addEventListener(
              "touchstart",
              e=>{
                  startPointer(
                      e.touches[0].clientX,
                      e.touches[0].clientY
                  );
              }
          );


          renderer.domElement.addEventListener(
              "touchmove",
              e=>{
                  movePointer(
                      e.touches[0].clientX,
                      e.touches[0].clientY
                  );
              }
          );


          renderer.domElement.addEventListener(
              "touchend",
              ()=>{
                  dragging=false;
              }
          );


          renderer.domElement.addEventListener(
              "mousedown",
              e=>{
                  startPointer(
                      e.clientX,
                      e.clientY
                  );
              }
          );


          addEventListener(
              "mousemove",
              e=>{
                  movePointer(
                      e.clientX,
                      e.clientY
                  );
              }
          );


          addEventListener(
              "mouseup",
              ()=>{
                  dragging=false;
              }
          );


          function startGame() {

              document.getElementById(
                  "menu"
              ).style.display="none";

              document.getElementById(
                  "title"
              ).style.display="none";

              document.getElementById(
                  "job"
              ).innerHTML=
                  "<h3>OPDRACHT GESTART</h3>"+
                  "Brand het nieuwe dakleer vast.<br><br>"+
                  "🔥 Let op brand!";

          }


          function animate() {

              requestAnimationFrame(
                  animate
              );

              currentX +=
                  (targetX-currentX)*.035;

              currentY +=
                  (targetY-currentY)*.035;


              const radius=31;

              camera.position.x =
                  Math.sin(currentX)*
                  radius;

              camera.position.z =
                  Math.cos(currentX)*
                  radius;

              camera.position.y =
                  11 +
                  currentY*14;

              camera.lookAt(
                  0,
                  1.5,
                  0
              );


              flame.scale.y =
                  .8+
                  Math.random()*.4;

              renderer.render(
                  scene,
                  camera
              );

          }

          animate();


          addEventListener(
              "resize",
              ()=>{

                  camera.aspect=
                      innerWidth/
                      innerHeight;

                  camera.updateProjectionMatrix();

                  renderer.setSize(
                      innerWidth,
                      innerHeight
                  );

              }
          );

          </script>

          </body>
          </html>
          EOF

      - name: Build APK
        working-directory: build/game
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp \
          build/game/app/build/outputs/apk/debug/app-debug.apk \
          "Bretje-P-BV-Dakwerk-Simulator.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bretje-P-BV-Dakwerk-Simulator
          path: Bretje-P-BV-Dakwerk-Simulator.apk
