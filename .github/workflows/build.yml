name: Build Bretje P B.V. v6.11 MOBILE CONTROLS ROOF BOND ICON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Bretje P B.V. v6 project
        shell: bash
        run: |
          set -e
          mkdir -p game
          echo '' | base64 -d > game/project.godot
          echo 'W2dkX3NjZW5lIGxvYWRfc3RlcHM9MiBmb3JtYXQ9M10KW2V4dF9yZXNvdXJjZSBwYXRoPSJyZXM6Ly9NYWluLmdkIiB0eXBlPSJTY3JpcHQiIGlkPSIxIl0KW25vZGUgbmFtZT0iTWFpbiIgdHlwZT0iTm9kZSJdCnNjcmlwdCA9IEV4dFJlc291cmNlKCIxIikK' | base64 -d > game/Main.tscn
          echo '' | base64 -d > game/Main.gd
          echo '' | base64 -d > game/export_presets.cfg
          test -f bretje_menu.jpg || { echo "bretje_menu.jpg ontbreekt in repository root"; exit 1; }
          cp bretje_menu.jpg game/bretje_menu.jpg
          if [ -f bretje_icon.png ]; then
            cp bretje_icon.png game/bretje_icon.png
          fi
          # Optional future high-detail Bretje GLB asset can live in repo root.
          if [ -f bretje_character.glb ]; then cp bretje_character.glb game/bretje_character.glb; fi
          echo '' | base64 -d > game/bretje_icon.svg
          if [ -f game/bretje_icon.png ]; then
            sed -i 's#config/icon="res://bretje_icon.svg"#config/icon="res://bretje_icon.png"#' game/project.godot
          fi

      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Install Godot 4.4 Android SDK requirements
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/platforms/android-34"

      - name: Configure Godot 4.4 Android CI settings
        shell: bash
        run: |
          set -euo pipefail

          # Resolve Android SDK path once and persist it for every later Actions step.
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              ANDROID_HOME="$ANDROID_SDK_ROOT"
            elif [ -d "/usr/local/lib/android/sdk" ]; then
              ANDROID_HOME="/usr/local/lib/android/sdk"
            else
              echo "ERROR: Android SDK not found"
              exit 1
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          # Godot 4.3+ stores editor settings per minor version.
          # Write the 4.4 file directly instead of relying on an EditorSettings script.
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

          echo "=== Godot 4.4 editor settings ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$JAVA_HOME"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          # Set all three debug signing overrides together.
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          echo "Godot 4.4 Android CI configuration OK"

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          cd game
          echo "Importing project and checking GDScript/resources..."
          timeout 120s ../godot --headless --editor --path . --quit-after 10 2>&1 | tee ../godot-import.log
          if grep -iE "SCRIPT ERROR|Parse Error|Failed to load script" ../godot-import.log; then
            echo "Project contains a script/import error."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd game

          # GitHub's Ubuntu Android image normally exports ANDROID_HOME in the shell.
          # Recover it defensively if a workflow context ever leaves it empty.
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              export ANDROID_HOME="$ANDROID_SDK_ROOT"
            elif [ -d "/usr/local/lib/android/sdk" ]; then
              export ANDROID_HOME="/usr/local/lib/android/sdk"
            else
              echo "ERROR: Android SDK path not found."
              exit 1
            fi
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "=== Godot ==="
          ../godot --version
          echo "=== Java ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=== Android tools ==="
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Android SDK + debug keystore OK"

          echo "=== Export templates ==="
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_"*.apk

          echo "=== Godot editor settings actually used ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

          echo "=== Android preset ==="
          cat export_presets.cfg

          echo "=== Validate Android preset + signing tuple ==="
          grep -F 'keystore/debug="/home/runner/.android/debug.keystore"' export_presets.cfg
          grep -F 'keystore/debug_user="androiddebugkey"' export_presets.cfg
          grep -F 'keystore/debug_password="android"' export_presets.cfg
          test "$(grep -c '^keystore/debug' export_presets.cfg)" -eq 3

          echo "=== Deep preflight ==="
          grep -F 'textures/vram_compression/import_etc2_astc=true' project.godot
          grep -F 'export_path="Bretje-P-BV-Dakwerk-Simulator-v6.11.apk"' export_presets.cfg
          grep -F 'version/name="6.11"' export_presets.cfg
          grep -F 'architectures/arm64-v8a=true' export_presets.cfg
          test -s Main.gd
          test -s Main.tscn
          test -s bretje_menu.jpg
          echo "Deep preflight OK"

          echo "=== Validate project pack before APK ==="
          mkdir -p ci-test
          timeout 300s ../godot --headless --verbose --path . --export-pack "Android" "ci-test/Bretje-v6.11-test.pck" 2>&1 | tee ../godot-pack-test.log
          test -s ci-test/Bretje-v6.11-test.pck

          echo "=== Export Android debug APK ==="
          set +e
          timeout 900s ../godot --headless --verbose --path . --export-debug "Android" "Bretje-P-BV-Dakwerk-Simulator-v6.11.apk" 2>&1 | tee ../godot-export.log
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "=== GODOT EXPORT FAILED - relevant diagnostics ==="
            grep -iE "error|invalid|missing|keystore|android sdk|java sdk|template|configuration|cannot export|texture|etc2|astc|compression" ../godot-export.log || true
            exit "$GODOT_EXIT"
          fi

          test -s Bretje-P-BV-Dakwerk-Simulator-v6.11.apk
          echo "=== APK CREATED SUCCESSFULLY ==="
          ls -lh Bretje-P-BV-Dakwerk-Simulator-v6.11.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bretje-P-BV-v6.11-APK
          path: game/Bretje-P-BV-Dakwerk-Simulator-v6.11.apk
          if-no-files-found: error
