name: Build Bretje P B.V. 3D APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create complete 3D Android game
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'build.gradle')"
          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC41LjInIGFwcGx5IGZhbHNlIH0K' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle')"
          echo '' | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/java/nl/dakdekker/game/MainActivity.java')"
          echo '' | base64 -d > 'app/src/main/java/nl/dakdekker/game/MainActivity.java'
          mkdir -p app/src/main/res/drawable-nodpi
          cp bretje_icon.png app/src/main/res/drawable-nodpi/bretje_icon.png
          cp bretje_menu.jpg app/src/main/res/drawable-nodpi/bretje_menu.jpg

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bretje-P-BV-Dakwerk-Simulator-v4.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bretje-P-BV-APK
          path: Bretje-P-BV-Dakwerk-Simulator-v4.apk
          if-no-files-found: error
